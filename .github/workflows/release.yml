# 自动打包发布。三种入口（经 plan job 统一裁决）：
#   1. push tag v*          → 按该 tag 打包发布（手动版本发布的原路径）
#   2. workflow_run（ci 在 main 上全绿）→ 自动 bump patch tag（v0.1.0 起）
#      并发布 Release——push main 即发版，无需手动打 tag。
#      注意联动用 workflow_run 而非「ci 里推 tag」：GITHUB_TOKEN 触发的
#      事件不会再触发其他 workflow，git push tag 挂空。
#   3. workflow_dispatch    → 仅打包出 artifacts，不发布
# 产物：
#   - Windows：portable zip（exe + feiwu.portable 标记；ubuntu 上
#     CGO_ENABLED=0 交叉编译——keyring 在 Windows 走纯 Go 的 wincred。
#     标记使数据/Cookie 全落 exe 旁 ./data/，免安装随文件夹走）
#   - macOS：universal .app 打成 dmg——macos-14(arm64) + macos-15-intel(amd64)
#     双原生构建（keychain 走 cgo 不交叉编译），dmg job 用 lipo 合并 universal；
#     dmg 未签名未公证，首开需右键 → 打开（绕过 Gatekeeper）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write  # gh release create/upload（workflow_run 联动发版所需）

jobs:
  # plan 裁决本次运行的形态：release（打包+发布）/ artifacts（仅打包）/
  # 空串（全部 job 跳过）。后续 job 一律以 plan 的输出作开关。
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}        # release | artifacts | 空
      tag: ${{ steps.decide.outputs.tag }}          # 带 v 前缀（release 用）
      version: ${{ steps.decide.outputs.version }}  # 无 v 前缀（plist/dmg 文件名）
      target: ${{ steps.decide.outputs.target }}    # 创建 tag/Release 的目标 sha
      create_tag: ${{ steps.decide.outputs.create_tag }}  # true=发版时新建 tag
    steps:
      # workflow_run 时 checkout 触发 ci 的那份提交（github.sha 即其 head
      # sha）；fetch-depth 0 拉全 tag 供 bump patch 计算
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$EVENT" = "push" ]; then
            # ① 手动打 tag：按该 tag 发布，tag 已存在不新建
            echo "mode=release"       >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME"      >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "target=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "create_tag=false"   >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_run" ]; then
            # ② ci 在 main 全绿 → 自动 bump patch tag（首个为 v0.1.0）；
            #    ci 失败 / PR 分支的 ci → 全部跳过
            if [ "$WR_CONCLUSION" != "success" ] || [ "$WR_BRANCH" != "main" ]; then
              echo "mode=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              ver="${latest#v}"; maj=${ver%%.*}; rest=${ver#*.}
              min=${rest%%.*}; pat=${rest##*.}
              next="v$maj.$min.$((pat+1))"
            fi
            echo "mode=release"       >> "$GITHUB_OUTPUT"
            echo "tag=$next"          >> "$GITHUB_OUTPUT"
            echo "version=${next#v}"  >> "$GITHUB_OUTPUT"
            echo "target=$WR_SHA"     >> "$GITHUB_OUTPUT"
            echo "create_tag=true"    >> "$GITHUB_OUTPUT"
          else
            # ③ 手动 dispatch：仅打包，artifacts 自取
            echo "mode=artifacts"     >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME"      >> "$GITHUB_OUTPUT"
            echo "version=$REF_NAME"  >> "$GITHUB_OUTPUT"
            echo "target=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "create_tag=false"   >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: plan
    if: needs.plan.outputs.mode != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # pnpm 版本读 web/package.json 的 packageManager 字段（仓库根无 package.json）
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端（产物直落 internal/webapi/web/dist 供 go:embed）
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: go build（windows/amd64）
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o feiwu-windows-amd64.exe ./cmd/feiwu

      # portable zip = exe + feiwu.portable 标记：启动后数据（含 Cookie）全落
      # exe 旁 ./data/（Cookie 走加密文件而非凭据管理器，见 store/paths.go），
      # 文件夹整体可移动、免安装。
      - name: 打 portable zip（exe + portable 标记）
        run: |
          mkdir pkg
          mv feiwu-windows-amd64.exe pkg/feiwu.exe
          touch pkg/feiwu.portable
          (cd pkg && zip ../feiwu-windows-amd64-portable.zip feiwu.exe feiwu.portable)

      - uses: actions/upload-artifact@v4
        with:
          name: feiwu-windows-amd64-portable.zip
          path: feiwu-windows-amd64-portable.zip
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.mode != ''
    strategy:
      matrix:
        include:
          - runner: macos-14        # Apple Silicon（arm64）
            goarch: arm64
          - runner: macos-15-intel  # Intel（amd64）；macos-13 镜像已下线
            goarch: amd64           # （actionlint 实测），Intel 原生改走 15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端（产物直落 internal/webapi/web/dist 供 go:embed）
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: go build（原生架构；keychain cgo 不交叉）
        run: |
          go build -trimpath -ldflags "-s -w" -o "feiwu-${{ matrix.goarch }}" ./cmd/feiwu

      - name: 图标转 icns（sips + iconutil，macOS 自带）
        run: |
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out "icon.iconset/icon_${s}x${s}.png"
            d=$((s*2))
            sips -z $d $d assets/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          sips -z 1024 1024 assets/icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o AppIcon.icns

      - name: 生成 Info.plist（版本号取 tag，dispatch 时取 ref 名）
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cat > Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>feiwu</string>
            <key>CFBundleDisplayName</key><string>飞舞</string>
            <key>CFBundleIdentifier</key><string>com.feiwu.downloader</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>feiwu</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      # 传裸件（二进制/plist/icns 分开）而非 .app 目录：两个架构 artifact
      # 在 dmg job merge-multiple 时同路径会互相覆盖；裸件中二进制名带架构
      # 后缀天然不冲突，plist/icns 两架构内容全同，覆盖无害。
      - uses: actions/upload-artifact@v4
        with:
          name: feiwu-macos-${{ matrix.goarch }}
          path: |
            feiwu-${{ matrix.goarch }}
            Info.plist
            AppIcon.icns
          if-no-files-found: error

  dmg:
    runs-on: macos-14
    needs: [plan, macos]
    if: always() && needs.plan.outputs.mode != '' && needs.macos.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: feiwu-macos-*
          merge-multiple: true

      - name: 组装 universal feiwu.app（lipo 合并双架构）
        run: |
          find artifacts -type f
          lipo -info artifacts/feiwu-arm64 artifacts/feiwu-amd64
          mkdir -p feiwu.app/Contents/MacOS feiwu.app/Contents/Resources
          cp artifacts/Info.plist feiwu.app/Contents/Info.plist
          cp artifacts/AppIcon.icns feiwu.app/Contents/Resources/AppIcon.icns
          lipo -create artifacts/feiwu-arm64 artifacts/feiwu-amd64 \
            -output feiwu.app/Contents/MacOS/feiwu
          chmod +x feiwu.app/Contents/MacOS/feiwu
          lipo -info feiwu.app/Contents/MacOS/feiwu

      - name: 打 dmg（内容 + Applications 软链，UDZO 压缩）
        env:
          # 文件名带 tag（v 前缀），与 release job 的资产引用一致
          VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir stage
          cp -R feiwu.app stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname feiwu -srcfolder stage -ov -format UDZO \
            "feiwu-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: feiwu-macos-universal.dmg
          path: feiwu-*-macos-universal.dmg
          if-no-files-found: error

  release:
    needs: [plan, windows, dmg]
    if: always() && needs.plan.outputs.mode == 'release' && needs.windows.result == 'success' && needs.dmg.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # gh 推断仓库用（gh 不读 GITHUB_REPOSITORY）

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: feiwu-*
          merge-multiple: true

      # 发版（自动 bump 的 tag 此时不存在 → --target 在该 sha 上建 tag；
      # 手动 tag 场景 tag 已存在 → --verify-tag 确认指向一致）
      - name: gh release create（已存在则 upload --clobber 兜底）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ needs.plan.outputs.target }}
          CREATE_TAG: ${{ needs.plan.outputs.create_tag }}
        run: |
          ls -lh artifacts
          if [ "$CREATE_TAG" = "true" ]; then
            extra="--target $TARGET"
          else
            extra="--verify-tag"
          fi
          gh release create "$TAG" $extra --generate-notes \
            "artifacts/feiwu-windows-amd64-portable.zip" \
            "artifacts/feiwu-${TAG}-macos-universal.dmg" \
            || gh release upload "$TAG" --clobber \
              "artifacts/feiwu-windows-amd64-portable.zip" \
              "artifacts/feiwu-${TAG}-macos-universal.dmg"
